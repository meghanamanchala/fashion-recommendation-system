<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="An AI-powered fashion recommendation system to explore and find similar clothing, shoes, and accessories.">
    <title>FashionFit | AI Fashion Recommendation System</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <div class="glass-bg"></div>
    <div class="glass-bg-2"></div>

    <header class="app-header">
        <div class="header-container">
            <div class="logo">
                <i class="fa-solid fa-wand-magic-sparkles logo-icon"></i>
                <span class="logo-text">Fashion<span class="logo-highlight">Fit</span></span>
            </div>
            <p class="tagline">Hyper-Personalized AI Fashion Recommendations</p>
        </div>
    </header>

    <main class="main-container">
        <!-- Search Section -->
        <section class="search-section" aria-label="Product Search">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="search-input" placeholder="Search for apparel, brands, shoes, colors..."
                    autocomplete="off">
                <button id="search-btn" class="btn btn-primary" aria-label="Search button">
                    <span>Search</span>
                </button>
            </div>
            <div class="quick-tags">
                <span class="quick-tag-label">Popular:</span>
                <button class="tag-btn" data-query="Puma Tshirts">Puma Tshirts</button>
                <button class="tag-btn" data-query="Nike Shoes">Nike Shoes</button>
                <button class="tag-btn" data-query="Blue Jeans">Blue Jeans</button>
                <button class="tag-btn" data-query="Summer Dress">Summer Dress</button>
                <button class="tag-btn" data-query="Formal Shirts">Formal Shirts</button>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-section" id="filter-panel" aria-label="Product Filters">
            <div class="filter-container">
                <!-- Gender Filter -->
                <div class="filter-group gender-filter-group">
                    <span class="filter-label">Gender</span>
                    <div class="gender-pills" id="gender-pills">
                        <button class="gender-pill active" data-gender="">All</button>
                        <button class="gender-pill" data-gender="men">Men</button>
                        <button class="gender-pill" data-gender="women">Women</button>
                        <button class="gender-pill" data-gender="boys">Boys</button>
                        <button class="gender-pill" data-gender="girls">Girls</button>
                        <button class="gender-pill" data-gender="unisex">Unisex</button>
                    </div>
                </div>

                <!-- Brand Filter -->
                <div class="filter-group brand-filter-group">
                    <label for="brand-select" class="filter-label">Brand</label>
                    <div class="select-wrapper">
                        <select id="brand-select" class="filter-select">
                            <option value="">All Brands</option>
                        </select>
                        <i class="fa-solid fa-chevron-down select-arrow"></i>
                    </div>
                </div>

                <!-- Price Filter -->
                <div class="filter-group price-filter-group">
                    <span class="filter-label">Price Under</span>
                    <div class="price-slider-container">
                        <input type="range" id="price-slider" min="15" max="200" value="200" class="price-slider">
                        <span id="price-slider-val" class="price-val">$200</span>
                    </div>
                </div>

                <!-- Reset Button -->
                <button id="reset-filters-btn" class="btn btn-secondary reset-btn" aria-label="Reset filters">
                    <i class="fa-solid fa-rotate-left"></i> <span>Reset</span>
                </button>
            </div>
        </section>

        <!-- Dynamic Content Grid -->
        <div class="content-layout">
            <!-- Search Results or Catalog -->
            <section class="results-section" id="results-panel">
                <div class="section-header">
                    <h2 class="section-title" id="results-title">Trending Styles</h2>
                    <span class="results-count" id="results-count">Showing 20 items</span>
                </div>

                <div class="products-grid" id="products-grid">
                    <!-- Products will be dynamically populated here -->
                    <div class="shimmer-wrapper">
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                        <div class="shimmer-card"></div>
                    </div>
                </div>
            </section>

            <!-- Sidebar: Selected Product & Recommendations -->
            <aside class="recommendations-sidebar hidden" id="recommendations-sidebar">
                <div class="sidebar-sticky">
                    <button class="close-sidebar-btn" id="close-sidebar" aria-label="Close sidebar">
                        <i class="fa-solid fa-times"></i>
                    </button>

                    <!-- Selected Product Card -->
                    <div class="selected-product-container">
                        <h3 class="sidebar-heading">Selected Item</h3>
                        <div id="selected-product-details">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                    <!-- Similar recommendations -->
                    <div class="recommendations-container">
                        <h3 class="sidebar-heading"><i class="fa-solid fa-sparkles"></i> Similiar Styles</h3>
                        <div class="recommendations-list" id="recommendations-list">
                            <!-- Populated dynamically -->
                        </div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Recently Viewed Section -->
        <section class="history-section hidden" id="history-section">
            <div class="section-header">
                <h2 class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Browsing History</h2>
                <button id="clear-history-btn" class="btn btn-text clear-history-btn" aria-label="Clear browsing history">
                    <i class="fa-solid fa-trash-can"></i> Clear History
                </button>
            </div>
            <div class="history-carousel-wrapper">
                <div class="history-grid" id="history-grid">
                    <!-- Dynamic history cards -->
                </div>
            </div>
        </section>
    </main>

    <footer class="app-footer">
        <p>&copy; 2026 FashionFit. Powered by TF-IDF & Cosine Similarity. Design by Senior ML Architect.</p>
    </footer>

    <!-- Custom JavaScript -->
    <script src="/static/js/main.js"></script>
</body>

</html>
